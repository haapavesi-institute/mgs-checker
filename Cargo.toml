[workspace]
resolver = "2"
members = ["crates/mgs-core", "crates/mgs-cli", "crates/mgs-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/peace-cat-games/mgs-checker"
homepage = "https://peace-cat-games.github.io/mgs-checker/"
publish = false

[workspace.dependencies]
mgs-core = { path = "crates/mgs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
