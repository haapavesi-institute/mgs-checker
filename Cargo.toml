[workspace]
resolver = "2"
members = ["crates/mgs-core", "crates/mgs-cli", "crates/mgs-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Ian Joiner"]
license = "Apache-2.0"
repository = "https://github.com/haapavesi-institute/mgs-checker"
homepage = "https://haapavesi-institute.github.io/mgs-checker/"
keywords = ["cluster-algebra", "quiver", "green-sequence", "mutation", "mathematics"]

[workspace.dependencies]
mgs-core = { path = "crates/mgs-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
codegen-units = 1
